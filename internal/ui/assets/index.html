<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mumble CVP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #09090b;
  --surface: #18181b;
  --surface-hover: #1f1f23;
  --border: #27272a;
  --border-light: #3f3f46;
  --text: #e4e4e7;
  --text-secondary: #a1a1aa;
  --text-tertiary: #71717a;
  --accent: #10b981;
  --accent-dim: rgba(16, 185, 129, 0.1);
  --accent-border: rgba(16, 185, 129, 0.2);
  --error: #ef4444;
  --error-dim: rgba(239, 68, 68, 0.1);
  --warn: #f59e0b;
  --warn-dim: rgba(245, 158, 11, 0.1);
  --radius: 8px;
}

body {
  font-family: 'Geist', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* Header */
.header {
  border-bottom: 1px solid var(--border);
  padding: 0 1.5rem;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  background: rgba(9, 9, 11, 0.8);
  backdrop-filter: blur(12px);
  z-index: 10;
}

.header-brand {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.header-logo {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  background: var(--accent-dim);
  border: 1px solid var(--accent-border);
  display: flex;
  align-items: center;
  justify-content: center;
}

.header-logo svg {
  width: 16px;
  height: 16px;
  color: var(--accent);
}

.header-title {
  font-size: 0.875rem;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.header-time {
  font-family: 'Geist Mono', monospace;
  font-size: 0.75rem;
  color: var(--text-tertiary);
}

.status {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.75rem;
  color: var(--text-secondary);
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--text-tertiary);
  transition: background 0.3s ease;
}

.status-dot.ok {
  background: var(--accent);
  box-shadow: 0 0 6px rgba(16, 185, 129, 0.4);
}

.status-dot.err {
  background: var(--error);
  box-shadow: 0 0 6px rgba(239, 68, 68, 0.4);
}

/* Main */
.main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 1.5rem;
}

/* Stats bar */
.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 1.5rem;
}

.stat {
  background: var(--surface);
  padding: 1rem 1.25rem;
}

.stat-label {
  font-size: 0.6875rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-tertiary);
  margin-bottom: 0.375rem;
}

.stat-value {
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1;
}

.stat-value.accent { color: var(--accent); }

/* Grid */
.grid {
  display: grid;
  grid-template-columns: 300px 1fr;
  gap: 1px;
  background: var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}

.panel {
  background: var(--surface);
}

.panel-header {
  padding: 0.875rem 1.25rem;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.panel-title {
  font-size: 0.8125rem;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.panel-badge {
  font-family: 'Geist Mono', monospace;
  font-size: 0.6875rem;
  color: var(--text-tertiary);
  background: var(--bg);
  padding: 0.125rem 0.5rem;
  border-radius: 999px;
}

.panel-body {
  padding: 0.5rem;
}

/* Channel tree */
.channel-item {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.375rem 0.625rem;
  border-radius: 6px;
  font-size: 0.8125rem;
  cursor: default;
  transition: background 0.15s ease;
}

.channel-item:hover {
  background: var(--surface-hover);
}

.channel-icon {
  color: var(--text-tertiary);
  flex-shrink: 0;
}

.channel-icon svg {
  width: 14px;
  height: 14px;
}

.channel-name {
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
}

.channel-count {
  font-family: 'Geist Mono', monospace;
  font-size: 0.6875rem;
  color: var(--text-tertiary);
  flex-shrink: 0;
}

.channel-pw {
  color: var(--warn);
  font-size: 0.6875rem;
  flex-shrink: 0;
}

/* User list */
.user-row {
  display: grid;
  grid-template-columns: 36px 1fr 120px 140px;
  align-items: center;
  gap: 0.75rem;
  padding: 0.5rem 0.875rem;
  border-radius: 6px;
  font-size: 0.8125rem;
  transition: background 0.15s ease;
}

.user-row:hover {
  background: var(--surface-hover);
}

.avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.75rem;
  font-weight: 600;
  color: #fff;
  flex-shrink: 0;
}

.user-name {
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.user-channel {
  font-size: 0.75rem;
  color: var(--text-tertiary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.user-platform {
  font-family: 'Geist Mono', monospace;
  font-size: 0.6875rem;
  color: var(--text-tertiary);
}

/* Badges */
.badges {
  display: flex;
  gap: 0.25rem;
  flex-wrap: wrap;
}

.badge {
  display: inline-flex;
  align-items: center;
  padding: 0.125rem 0.375rem;
  border-radius: 4px;
  font-family: 'Geist Mono', monospace;
  font-size: 0.625rem;
  font-weight: 500;
  letter-spacing: 0.02em;
}

.badge.mute { background: rgba(239, 68, 68, 0.12); color: #f87171; }
.badge.deaf { background: rgba(139, 92, 246, 0.12); color: #c4b5fd; }
.badge.suppress { background: var(--warn-dim); color: #fbbf24; }
.badge.priority { background: var(--accent-dim); color: var(--accent); }

/* Empty / skeleton */
.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 3rem 1rem;
  color: var(--text-tertiary);
  font-size: 0.8125rem;
}

.empty-icon {
  margin-bottom: 0.75rem;
  color: var(--border-light);
}

.skeleton {
  background: linear-gradient(90deg, var(--surface-hover) 25%, var(--border) 50%, var(--surface-hover) 75%);
  background-size: 200% 100%;
  animation: skeleton 1.5s ease-in-out infinite;
  border-radius: 4px;
}

@keyframes skeleton {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* Responsive */
@media (max-width: 768px) {
  .grid {
    grid-template-columns: 1fr;
  }

  .stats {
    grid-template-columns: repeat(3, 1fr);
  }

  .user-row {
    grid-template-columns: 32px 1fr;
    gap: 0.5rem;
  }

  .user-channel, .user-platform {
    display: none;
  }

  .header-time {
    display: none;
  }
}

@media (max-width: 480px) {
  .stats {
    grid-template-columns: 1fr;
  }

  .main {
    padding: 1rem;
  }
}
</style>
</head>
<body>
<div x-data="app()">
  <header class="header">
    <div class="header-brand">
      <div class="header-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </div>
      <span class="header-title">Mumble CVP</span>
    </div>
    <div class="header-right">
      <span class="header-time" x-text="lastUpdate"></span>
      <div class="status">
        <span class="status-dot" :class="statusDotClass"></span>
        <span x-text="statusText"></span>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="stats">
      <div class="stat">
        <div class="stat-label">Users Online</div>
        <div class="stat-value accent" x-text="userCount"></div>
      </div>
      <div class="stat">
        <div class="stat-label">Channels</div>
        <div class="stat-value" x-text="channelCount"></div>
      </div>
      <div class="stat">
        <div class="stat-label">Server</div>
        <div class="stat-value" style="font-size: 1rem; font-weight: 500;" x-text="serverName"></div>
      </div>
    </div>

    <div class="grid">
      <!-- Channel Tree -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Channels</span>
          <span class="panel-badge" x-text="channelCount"></span>
        </div>
        <div class="panel-body" x-show="loading">
          <template x-for="i in 5" :key="'sk-ch-' + i">
            <div class="channel-item"><div class="skeleton" style="height:14px;width:60%"></div></div>
          </template>
        </div>
        <div class="panel-body" x-show="!loading && channelTree.length === 0">
          <div class="empty">
            <svg class="empty-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            No channels
          </div>
        </div>
        <div class="panel-body" x-show="!loading && channelTree.length > 0" style="padding: 0.25rem;">
          <template x-for="ch in channelTree" :key="'ch-' + ch.id">
            <div class="channel-item" :style="ch.indent > 0 ? 'padding-left: calc(0.625rem + ' + (ch.indent * 1.25) + 'rem)' : ''">
              <span class="channel-icon">
                <svg x-show="ch.hasChildren" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                <svg x-show="!ch.hasChildren" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
              </span>
              <span class="channel-name" x-text="ch.name" :title="ch.name"></span>
              <span class="channel-pw" x-show="ch.password_set">&#9679;</span>
              <span class="channel-count" x-text="ch.userCount"></span>
            </div>
          </template>
        </div>
      </div>

      <!-- Users -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Users</span>
          <span class="panel-badge" x-text="userCount"></span>
        </div>
        <div class="panel-body" x-show="loading">
          <template x-for="i in 4" :key="'sk-u-' + i">
            <div class="user-row">
              <div class="skeleton" style="height:32px;width:32px;border-radius:50%"></div>
              <div class="skeleton" style="height:14px;width:40%"></div>
              <div class="skeleton" style="height:14px;width:80%"></div>
              <div class="skeleton" style="height:14px;width:60%"></div>
            </div>
          </template>
        </div>
        <div class="panel-body" x-show="!loading && users.length === 0">
          <div class="empty">
            <svg class="empty-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            No users online
          </div>
        </div>
        <div class="panel-body" x-show="!loading && users.length > 0" style="padding: 0.25rem;">
          <template x-for="u in users" :key="u.session">
            <div class="user-row">
              <div class="avatar" :style="'background:' + avatarColor(u.name)" x-text="u.name.charAt(0).toUpperCase()"></div>
              <div>
                <div class="user-name" x-text="u.name" :title="u.name"></div>
                <div class="user-channel" x-text="u.channel" :title="u.channel"></div>
              </div>
              <div class="badges">
                <template x-if="u.priority"><span class="badge priority">P</span></template>
                <template x-if="u.self_mute"><span class="badge mute">M</span></template>
                <template x-if="u.self_deaf"><span class="badge deaf">D</span></template>
                <template x-if="u.mute"><span class="badge mute">m</span></template>
                <template x-if="u.deaf"><span class="badge deaf">d</span></template>
                <template x-if="u.suppress"><span class="badge suppress">S</span></template>
              </div>
              <div class="user-platform" x-text="u.platform.split(' ')[0]" :title="u.platform"></div>
            </div>
          </template>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
function app() {
  return {
    users: [],
    channels: [],
    channelTree: [],
    userCount: 0,
    channelCount: 0,
    serverName: '-',
    statusText: 'connecting',
    statusDotClass: '',
    lastUpdate: '',
    loading: true,
    interval: null,

    async init() {
      await this.fetch();
      this.interval = setInterval(() => this.fetch(), 5000);
    },

    async fetch() {
      try {
        const treeRes = await fetch('/api/tree/0');
        if (!treeRes.ok) throw new Error('tree fetch failed');
        const treeData = await treeRes.json();
        const tree = treeData.tree;

        this.users = flattenUsers(tree).map(u => ({
          ...u,
          channel: findChannelName(tree, u.channel_id)
        }));
        this.userCount = this.users.length;

        this.channelTree = buildChannelTree(tree, 0);
        this.channelCount = this.channelTree.length;

        try {
          const nameRes = await fetch('/api/tree/0');
          if (nameRes.ok) {
            // server name would come from a dedicated endpoint
            this.serverName = 'murmur';
          }
        } catch(_) {}

        this.statusText = 'connected';
        this.statusDotClass = 'ok';
        this.lastUpdate = new Date().toLocaleTimeString();
      } catch (e) {
        this.statusText = 'disconnected';
        this.statusDotClass = 'err';
      } finally {
        this.loading = false;
      }
    },

    avatarColor(name) {
      const colors = [
        '#6366f1', '#8b5cf6', '#a855f7', '#7c3aed',
        '#0891b2', '#0d9488', '#059669', '#0ea5e9',
        '#2563eb', '#4f46e5', '#dc2626', '#ea580c',
        '#d97706', '#65a30d', '#64748b', '#475569'
      ];
      let h = 0;
      for (let i = 0; i < name.length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
      return colors[Math.abs(h) % colors.length];
    }
  };
}

function flattenUsers(tree) {
  let result = [...tree.users];
  for (const child of tree.children || []) {
    result = result.concat(flattenUsers(child));
  }
  return result;
}

function findChannelName(tree, id) {
  if (tree.channel.id === id) return tree.channel.name;
  for (const child of tree.children || []) {
    const name = findChannelName(child, id);
    if (name) return name;
  }
  return '';
}

function buildChannelTree(tree, indent) {
  const users = flattenUsers(tree);
  const result = [{
    id: tree.channel.id,
    name: tree.channel.name,
    indent,
    userCount: tree.users.length,
    hasChildren: (tree.children || []).length > 0,
    password_set: tree.channel.password_set
  }];
  for (const child of (tree.children || [])) {
    result = result.concat(buildChannelTree(child, indent + 1));
  }
  return result;
}
</script>
</body>
</html>
