<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mumble-cvp · Dashboard</title>
    <link rel="stylesheet" href="/assets/shared.css" />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
  </head>
  <body>
    <div x-data="dashboard()" class="app-shell">
      <!-- Mobile overlay -->
      <div
        class="sidebar-overlay"
        :class="sidebarOpen ? 'open' : ''"
        @click="sidebarOpen = false"
      ></div>

      <!-- ════════ SIDEBAR ════════ -->
      <aside class="sidebar" :class="sidebarOpen ? 'open' : ''">
        <div class="sidebar-brand">
          <svg
            class="w-5 h-5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="var(--accent)"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
            <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
            <line x1="12" y1="19" x2="12" y2="23" />
            <line x1="8" y1="23" x2="16" y2="23" />
          </svg>
          mumble-cvp
        </div>

        <nav class="sidebar-nav">
          <div class="sidebar-section">Navigation</div>
          <a
            class="sidebar-link"
            :class="page === 'overview' ? 'active' : ''"
            @click="page = 'overview'"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="3" y="3" width="7" height="7" rx="1" />
              <rect x="14" y="3" width="7" height="7" rx="1" />
              <rect x="3" y="14" width="7" height="7" rx="1" />
              <rect x="14" y="14" width="7" height="7" rx="1" />
            </svg>
            Overview
          </a>
          <a
            class="sidebar-link"
            :class="page === 'channels' ? 'active' : ''"
            @click="page = 'channels'"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"
              />
            </svg>
            Channels
          </a>
          <a
            class="sidebar-link"
            :class="page === 'users' ? 'active' : ''"
            @click="page = 'users'"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
              <path d="M16 3.13a4 4 0 0 1 0 7.75" />
            </svg>
            Users
          </a>
          <a
            class="sidebar-link"
            :class="page === 'activity' ? 'active' : ''"
            @click="page = 'activity'"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
            </svg>
            Activity
          </a>

          <div class="sidebar-section">System</div>
          <a
            class="sidebar-link"
            :class="page === 'bans' ? 'active' : ''"
            @click="page = 'bans'"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="12" cy="12" r="10" />
              <line x1="4.93" y1="4.93" x2="19.07" y2="19.07" />
            </svg>
            Bans
          </a>
          <a
            class="sidebar-link"
            :class="page === 'listening' ? 'active' : ''"
            @click="page = 'listening'"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            Listening
          </a>

          <div class="sidebar-section">Access</div>
          <a href="/admin" class="sidebar-link">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="12" cy="12" r="3" />
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
              />
            </svg>
            Admin Panel
          </a>
        </nav>

        <div class="sidebar-footer">
          <div class="flex items-center gap-3 px-2">
            <div class="avatar" style="background: var(--accent)">S</div>
            <div class="min-w-0">
              <div class="text-sm font-semibold truncate">Server</div>
              <div
                class="text-xs text-muted truncate"
                x-text="serverName || 'mumble-cvp'"
              ></div>
            </div>
          </div>
        </div>
      </aside>

      <!-- ════════ MAIN AREA ════════ -->
      <main class="main-area">
        <header class="topbar">
          <div class="flex items-center gap-3">
            <button
              class="btn-ghost p-1.5 rounded-lg md:hidden"
              @click="sidebarOpen = !sidebarOpen"
            >
              <svg
                class="w-5 h-5"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <line x1="3" y1="6" x2="21" y2="6" />
                <line x1="3" y1="12" x2="21" y2="12" />
                <line x1="3" y1="18" x2="21" y2="18" />
              </svg>
            </button>
            <span class="topbar-title" x-text="pageTitle"></span>
          </div>
          <div class="flex items-center gap-3">
            <span
              class="badge"
              :class="statusClass === 'connected' ? 'badge-green' : 'badge-red'"
            >
              <span
                class="badge-dot"
                :class="statusClass === 'connected' ? 'bg-green' : 'bg-red'"
              ></span>
              <span x-text="statusText"></span>
            </span>
          </div>
        </header>

        <div class="content">
          <!-- ═══ OVERVIEW ═══ -->
          <div x-show="page === 'overview'">
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
              <div class="kpi">
                <div class="kpi-icon" style="background: var(--accent-dim)">
                  <svg
                    class="w-5 h-5 text-[var(--accent)]"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                    <circle cx="9" cy="7" r="4" />
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                    <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                  </svg>
                </div>
                <div class="kpi-value" x-text="users.length">0</div>
                <div class="kpi-label">Users Online</div>
              </div>
              <div class="kpi">
                <div class="kpi-icon" style="background: var(--green-dim)">
                  <svg
                    class="w-5 h-5 text-[var(--green)]"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path
                      d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"
                    />
                  </svg>
                </div>
                <div class="kpi-value" x-text="channelCount">0</div>
                <div class="kpi-label">Channels</div>
              </div>
              <div class="kpi">
                <div class="kpi-icon" style="background: var(--purple-dim)">
                  <svg
                    class="w-5 h-5 text-[var(--purple)]"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <circle cx="12" cy="12" r="10" />
                    <polyline points="12 6 12 12 16 14" />
                  </svg>
                </div>
                <div class="kpi-value mono" x-text="uptimeText">0s</div>
                <div class="kpi-label">Uptime</div>
              </div>
              <div class="kpi">
                <div class="kpi-icon" style="background: var(--cyan-dim)">
                  <svg
                    class="w-5 h-5 text-[var(--cyan)]"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
                  </svg>
                </div>
                <div
                  class="kpi-value mono text-base"
                  x-text="stats.version || '-'"
                >
                  -
                </div>
                <div class="kpi-label">Server Version</div>
              </div>
            </div>

            <!-- Online Users + Channel Tree -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-6">
              <!-- Online Users -->
              <div class="card">
                <div class="card-header">
                  <span class="card-title">Online Users</span>
                  <span class="badge badge-green" x-text="users.length"></span>
                </div>
                <div
                  class="card-body"
                  style="max-height: 360px; overflow-y: auto"
                >
                  <template x-if="loading">
                    <div class="empty-state">
                      <svg
                        class="w-8 h-8"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.5"
                      >
                        <circle cx="12" cy="12" r="4" />
                        <path d="M12 2v2m0 16v2M2 12h2m16 0h2" />
                      </svg>
                      <span class="text-sm">Loading...</span>
                    </div>
                  </template>
                  <template x-if="!loading && users.length === 0">
                    <div class="empty-state">
                      <svg
                        class="w-8 h-8"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.5"
                      >
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                        <circle cx="9" cy="7" r="4" />
                      </svg>
                      <span class="text-sm">No users online</span>
                    </div>
                  </template>
                  <template x-if="!loading && users.length > 0">
                    <div class="flex flex-col gap-1">
                      <template
                        x-for="user in users"
                        :key="'ov-u-'+user.session"
                      >
                        <div
                          class="flex items-center gap-2.5 py-1.5 px-2 rounded-lg cursor-pointer hover:bg-[var(--surface-2)] transition-colors"
                          @click="expandedUsers = symToggle(expandedUsers, user.session)"
                        >
                          <div
                            class="avatar"
                            :style="'background: ' + avatarColor(user.name)"
                            style="width: 28px; height: 28px; font-size: 11px"
                            x-text="user.name ? user.name.charAt(0).toUpperCase() : '?'"
                          ></div>
                          <div class="min-w-0 flex-1">
                            <div
                              class="text-sm font-medium truncate"
                              x-text="user.name || 'Unknown'"
                            ></div>
                            <div
                              class="text-xs text-muted truncate"
                              x-text="channelName(user.channel_id)"
                            ></div>
                          </div>
                          <div class="flex items-center gap-1 flex-shrink-0">
                            <template x-if="user.priority_speaker"
                              ><span class="badge badge-blue text-[9px] px-1"
                                >pri</span
                              ></template
                            >
                            <template x-if="user.mute"
                              ><span class="badge badge-red text-[9px] px-1"
                                >mute</span
                              ></template
                            >
                            <template x-if="user.ping_ms > 0">
                              <span
                                class="w-1.5 h-1.5 rounded-full flex-shrink-0"
                                :class="{
                            'bg-green': user.ping_ms <= 100,
                            'bg-amber': user.ping_ms <= 300,
                            'bg-red': user.ping_ms > 300
                          }"
                              ></span>
                            </template>
                          </div>
                        </div>
                        <div
                          x-show="expandedUsers.includes(user.session)"
                          class="ml-2 mr-2 mb-1 p-2.5 rounded-lg bg-[var(--surface-2)] text-xs"
                        >
                          <div class="grid grid-cols-2 gap-x-3 gap-y-0.5">
                            <span class="text-muted">IP</span
                            ><span class="mono" x-text="user.ip || '-'"></span>
                            <span class="text-muted">Version</span
                            ><span
                              class="mono"
                              x-text="user.version || user.version2 || '-'"
                            ></span>
                            <span class="text-muted">Platform</span
                            ><span x-text="user.platform || '-'"></span>
                            <span class="text-muted">Idle</span
                            ><span
                              class="mono"
                              x-text="formatDuration(user.idle_secs)"
                            ></span>
                          </div>
                          <template x-if="user.comment">
                            <div
                              class="mt-1 pt-1 border-t border-[var(--border)]"
                            >
                              <span class="text-muted">Comment: </span
                              ><span x-text="user.comment"></span>
                            </div>
                          </template>
                        </div>
                      </template>
                    </div>
                  </template>
                </div>
              </div>

              <!-- Channel Tree -->
              <div class="card">
                <div class="card-header">
                  <span class="card-title">Channels</span>
                  <span class="badge badge-muted" x-text="channelCount"></span>
                </div>
                <div
                  class="card-body"
                  style="max-height: 360px; overflow-y: auto"
                >
                  <template x-if="loading">
                    <div class="empty-state">
                      <svg
                        class="w-8 h-8"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.5"
                      >
                        <circle cx="12" cy="12" r="4" />
                        <path d="M12 2v2m0 16v2M2 12h2m16 0h2" />
                      </svg>
                      <span class="text-sm">Loading...</span>
                    </div>
                  </template>
                  <template x-if="!loading && treeChannels.length === 0">
                    <div class="empty-state">
                      <svg
                        class="w-8 h-8"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.5"
                      >
                        <path
                          d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"
                        />
                      </svg>
                      <span class="text-sm">No channels</span>
                    </div>
                  </template>
                  <template x-if="!loading && treeChannels.length > 0">
                    <div>
                      <template
                        x-for="node in treeChannelNodes"
                        :key="'tc-'+node.ch.id"
                      >
                        <div>
                          <div
                            class="flex items-center gap-1.5 py-1 px-2 rounded-lg cursor-pointer hover:bg-[var(--surface-2)] transition-colors"
                            :style="'padding-left: ' + (10 + node.depth * 16) + 'px'"
                            @click="openChannels = symToggle(openChannels, node.ch.id)"
                          >
                            <svg
                              class="w-3.5 h-3.5 text-muted flex-shrink-0 transition-transform duration-150"
                              :class="{'rotate-90': openChannels.includes(node.ch.id)}"
                              x-show="node.hasChildren || node.userCount > 0"
                              viewBox="0 0 24 24"
                              fill="none"
                              stroke="currentColor"
                              stroke-width="2"
                            >
                              <polyline points="9 18 15 12 9 6" />
                            </svg>
                            <span
                              class="w-3.5 flex-shrink-0"
                              x-show="!(node.hasChildren || node.userCount > 0)"
                            ></span>
                            <svg
                              class="w-4 h-4 text-muted flex-shrink-0"
                              viewBox="0 0 24 24"
                              fill="none"
                              stroke="currentColor"
                              stroke-width="2"
                            >
                              <path
                                d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"
                              />
                            </svg>
                            <span
                              class="flex-1 min-w-0 truncate text-sm"
                              x-text="node.ch.name"
                            ></span>
                            <span
                              class="badge badge-muted text-[10px] px-1.5"
                              x-text="node.userCount"
                              x-show="node.userCount > 0"
                            ></span>
                          </div>
                          <!-- Users in this channel (shown when expanded) -->
                          <template x-if="openChannels.includes(node.ch.id)">
                            <div>
                              <template
                                x-for="u in node.channelUsers"
                                :key="'tcu-'+u.session"
                              >
                                <div
                                  class="flex items-center gap-2 py-0.5"
                                  :style="'padding-left: ' + (30 + node.depth * 16) + 'px'"
                                >
                                  <span
                                    class="w-[16px] h-[16px] flex-shrink-0 flex items-center justify-center rounded-full bg-[var(--surface-3)] text-[9px] font-bold text-muted"
                                    x-text="u.name ? u.name.charAt(0).toUpperCase() : '?'"
                                  ></span>
                                  <span
                                    class="truncate text-xs text-secondary"
                                    x-text="u.name || 'Unknown'"
                                  ></span>
                                </div>
                              </template>
                            </div>
                          </template>
                        </div>
                      </template>
                    </div>
                  </template>
                </div>
              </div>
            </div>

            <!-- Activity Chart -->
            <div class="card">
              <div class="card-header">
                <span class="card-title">Activity (7 days)</span>
                <span class="text-xs text-muted">Avg sessions</span>
              </div>
              <div class="card-body">
                <div class="flex items-end gap-3 h-36">
                  <template x-for="(d, i) in activityData" :key="i">
                    <div class="flex-1 flex flex-col items-center gap-1">
                      <div
                        class="chart-bar w-full"
                        :style="'height:' + d.h + '%; background: ' + (d.h > 60 ? 'var(--accent)' : 'var(--surface-3)')"
                        style="min-height: 4px"
                      ></div>
                      <span
                        class="text-[10px] text-muted"
                        x-text="d.label"
                      ></span>
                    </div>
                  </template>
                </div>
              </div>
            </div>
          </div>

          <!-- ═══ CHANNELS ═══ -->
          <div x-show="page === 'channels'">
            <div class="card">
              <div class="card-header">
                <span class="card-title">Channel Tree</span>
                <span
                  class="badge badge-muted"
                  x-text="channelCount + ' channels'"
                ></span>
              </div>
              <div
                class="card-body"
                style="max-height: calc(100dvh - 200px); overflow-y: auto"
              >
                <template x-if="loading">
                  <div class="empty-state">
                    <svg
                      class="w-8 h-8"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.5"
                    >
                      <circle cx="12" cy="12" r="4" />
                      <path d="M12 2v2m0 16v2M2 12h2m16 0h2" />
                    </svg>
                    <span class="text-sm">Loading channels...</span>
                  </div>
                </template>
                <template x-if="!loading && treeChannels.length === 0">
                  <div class="empty-state">
                    <svg
                      class="w-8 h-8"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.5"
                    >
                      <path
                        d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"
                      />
                    </svg>
                    <span class="text-sm">No channels</span>
                  </div>
                </template>
                <template x-if="!loading && treeChannels.length > 0">
                  <div>
                    <template
                      x-for="node in treeChannelNodes"
                      :key="'ch-'+node.ch.id"
                    >
                      <div>
                        <div
                          class="flex items-center gap-1.5 py-1.5 px-2 rounded-lg cursor-pointer hover:bg-[var(--surface-2)] transition-colors"
                          :style="'padding-left: ' + (10 + node.depth * 16) + 'px'"
                          @click="openChannels = symToggle(openChannels, node.ch.id)"
                        >
                          <svg
                            class="w-3.5 h-3.5 text-muted flex-shrink-0 transition-transform duration-150"
                            :class="{'rotate-90': openChannels.includes(node.ch.id)}"
                            x-show="node.hasChildren || node.userCount > 0"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                          >
                            <polyline points="9 18 15 12 9 6" />
                          </svg>
                          <span
                            class="w-3.5 flex-shrink-0"
                            x-show="!(node.hasChildren || node.userCount > 0)"
                          ></span>
                          <svg
                            class="w-4 h-4 text-muted flex-shrink-0"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                          >
                            <path
                              d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"
                            />
                          </svg>
                          <span
                            class="flex-1 min-w-0 truncate text-sm"
                            x-text="node.ch.name"
                          ></span>
                          <span
                            class="badge badge-muted text-[10px] px-1.5"
                            x-text="node.userCount"
                            x-show="node.userCount > 0"
                          ></span>
                        </div>
                        <template x-if="openChannels.includes(node.ch.id)">
                          <div>
                            <template
                              x-for="u in node.channelUsers"
                              :key="'chu-'+u.session"
                            >
                              <div
                                class="flex items-center gap-2 py-0.5"
                                :style="'padding-left: ' + (30 + node.depth * 16) + 'px'"
                              >
                                <span
                                  class="w-[16px] h-[16px] flex-shrink-0 flex items-center justify-center rounded-full bg-[var(--surface-3)] text-[9px] font-bold text-muted"
                                  x-text="u.name ? u.name.charAt(0).toUpperCase() : '?'"
                                ></span>
                                <span
                                  class="truncate text-xs text-secondary"
                                  x-text="u.name || 'Unknown'"
                                ></span>
                              </div>
                            </template>
                          </div>
                        </template>
                      </div>
                    </template>
                  </div>
                </template>
              </div>
            </div>
          </div>

          <!-- ═══ USERS ═══ -->
          <div x-show="page === 'users'">
            <div class="flex items-center justify-between mb-4">
              <h2 class="font-semibold text-base">All Users</h2>
              <span
                class="badge badge-muted"
                x-text="users.length + ' online'"
              ></span>
            </div>
            <template x-if="loading">
              <div class="empty-state">
                <svg
                  class="w-8 h-8"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                >
                  <circle cx="12" cy="12" r="4" />
                  <path d="M12 2v2m0 16v2M2 12h2m16 0h2" />
                </svg>
                <span class="text-sm">Loading users...</span>
              </div>
            </template>
            <template x-if="!loading && users.length === 0">
              <div class="empty-state">
                <svg
                  class="w-8 h-8"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                >
                  <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                  <circle cx="9" cy="7" r="4" />
                </svg>
                <span class="text-sm">No users online</span>
              </div>
            </template>
            <template x-if="!loading && users.length > 0">
              <div class="flex flex-col gap-2">
                <template x-for="user in users" :key="user.session">
                  <div class="card">
                    <div class="card-body">
                      <div class="flex items-center gap-3">
                        <div
                          class="avatar"
                          :style="'background: ' + avatarColor(user.name)"
                          x-text="user.name ? user.name.charAt(0).toUpperCase() : '?'"
                        ></div>
                        <div class="min-w-0 flex-1">
                          <div
                            class="font-medium text-sm"
                            x-text="user.name || 'Unknown'"
                          ></div>
                          <div
                            class="text-xs text-secondary"
                            x-text="channelName(user.channel_id)"
                          ></div>
                        </div>
                        <div
                          class="flex items-center gap-1.5 flex-wrap justify-end"
                        >
                          <template x-if="user.priority_speaker"
                            ><span class="badge badge-blue">pri</span></template
                          >
                          <template x-if="user.mute"
                            ><span class="badge badge-red">mute</span></template
                          >
                          <template x-if="user.deaf"
                            ><span class="badge badge-red">deaf</span></template
                          >
                          <template x-if="user.suppress"
                            ><span class="badge badge-amber"
                              >suppress</span
                            ></template
                          >
                          <template x-if="user.recording"
                            ><span class="badge badge-red">rec</span></template
                          >
                          <template x-if="user.tcp_only"
                            ><span class="badge badge-muted"
                              >tcp</span
                            ></template
                          >
                        </div>
                        <div class="flex items-center gap-2 flex-shrink-0">
                          <template x-if="user.ping_ms > 0">
                            <span
                              class="w-2 h-2 rounded-full flex-shrink-0"
                              :class="{
                          'bg-green': user.ping_ms <= 100,
                          'bg-amber': user.ping_ms <= 300,
                          'bg-red': user.ping_ms > 300
                        }"
                            ></span>
                          </template>
                          <span
                            class="mono text-xs text-secondary flex-shrink-0"
                            x-text="user.online_formatted || '--'"
                          ></span>
                          <button
                            class="btn btn-ghost btn-sm"
                            @click="expandedUsers = symToggle(expandedUsers, user.session)"
                            title="Details"
                          >
                            <svg
                              class="w-4 h-4"
                              viewBox="0 0 24 24"
                              fill="none"
                              stroke="currentColor"
                              stroke-width="2"
                            >
                              <circle cx="12" cy="12" r="10" />
                              <line x1="12" y1="16" x2="12" y2="12" />
                              <line x1="12" y1="8" x2="12.01" y2="8" />
                            </svg>
                          </button>
                        </div>
                      </div>
                      <div
                        x-show="expandedUsers.includes(user.session)"
                        class="mt-3 pt-3 border-t border-[var(--border)]"
                      >
                        <div
                          class="grid grid-cols-2 md:grid-cols-4 gap-3 text-sm"
                        >
                          <div>
                            <div class="text-xs text-muted mb-0.5">
                              IP Address
                            </div>
                            <div
                              class="mono text-xs"
                              x-text="user.ip || 'unknown'"
                            ></div>
                          </div>
                          <div>
                            <div class="text-xs text-muted mb-0.5">Version</div>
                            <div
                              class="mono text-xs"
                              x-text="user.version || user.version2 || 'unknown'"
                            ></div>
                          </div>
                          <div>
                            <div class="text-xs text-muted mb-0.5">
                              Platform
                            </div>
                            <div
                              class="text-xs"
                              x-text="user.platform || 'unknown'"
                            ></div>
                          </div>
                          <div>
                            <div class="text-xs text-muted mb-0.5">Idle</div>
                            <div
                              class="mono text-xs"
                              x-text="formatDuration(user.idle_secs)"
                            ></div>
                          </div>
                          <template x-if="user.comment">
                            <div class="col-span-2">
                              <div class="text-xs text-muted mb-0.5">
                                Comment
                              </div>
                              <div class="text-xs" x-text="user.comment"></div>
                            </div>
                          </template>
                        </div>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
            </template>
          </div>

          <!-- ═══ ACTIVITY ═══ -->
          <div x-show="page === 'activity'">
            <div class="card mb-4">
              <div class="card-header">
                <span class="card-title">Activity Overview</span>
              </div>
              <div class="card-body">
                <div class="flex items-end gap-3 h-48 mb-4">
                  <template x-for="(d, i) in activityData" :key="i">
                    <div class="flex-1 flex flex-col items-center gap-1">
                      <span
                        class="text-xs font-semibold mono"
                        x-text="d.val"
                      ></span>
                      <div
                        class="chart-bar w-full"
                        :style="'height:' + d.h + '%; background: ' + (d.h > 60 ? 'var(--accent)' : 'var(--surface-3)')"
                        style="min-height: 4px"
                      ></div>
                      <span
                        class="text-[10px] text-muted"
                        x-text="d.label"
                      ></span>
                    </div>
                  </template>
                </div>
              </div>
            </div>
            <div class="terminal">
              <div class="terminal-bar">
                <span
                  class="terminal-dot"
                  style="background: var(--red)"
                ></span>
                <span
                  class="terminal-dot"
                  style="background: var(--amber)"
                ></span>
                <span
                  class="terminal-dot"
                  style="background: var(--green)"
                ></span>
                <span class="text-xs text-muted ml-2 mono">server.log</span>
                <label
                  class="flex items-center gap-1 text-xs text-muted ml-auto cursor-pointer"
                >
                  <input
                    type="checkbox"
                    x-model="autoScroll"
                    class="w-auto"
                  />Auto
                </label>
              </div>
              <div class="terminal-body" x-ref="logBody">
                <template x-if="logEntries.length === 0">
                  <div class="text-muted text-sm">
                    Waiting for log entries...
                  </div>
                </template>
                <template x-for="entry in logEntries" :key="entry.timestamp">
                  <div class="terminal-line">
                    <span
                      class="terminal-ts"
                      x-text="formatTime(entry.timestamp)"
                    ></span>
                    <span
                      class="terminal-msg"
                      :class="logLevel(entry.text)"
                      x-text="entry.text"
                    ></span>
                  </div>
                </template>
              </div>
            </div>
          </div>

          <!-- ═══ BANS ═══ -->
          <div x-show="page === 'bans'">
            <div class="flex items-center justify-between mb-4">
              <h2 class="font-semibold text-base">Active Bans</h2>
              <span class="badge badge-muted" x-text="bans.length"></span>
            </div>
            <template x-if="bans.length === 0">
              <div class="empty-state">
                <svg
                  class="w-8 h-8"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                >
                  <circle cx="12" cy="12" r="10" />
                  <path d="M8 12h8" />
                </svg>
                <span class="text-sm">No active bans</span>
              </div>
            </template>
            <template x-if="bans.length > 0">
              <div class="flex flex-col gap-2">
                <template
                  x-for="ban in sortedBans"
                  :key="ban.address + ban.bits"
                >
                  <div class="card">
                    <div class="card-body">
                      <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3">
                          <div
                            class="avatar"
                            style="
                              background: var(--red-dim);
                              color: var(--red);
                            "
                          >
                            <svg
                              class="w-4 h-4"
                              viewBox="0 0 24 24"
                              fill="none"
                              stroke="currentColor"
                              stroke-width="2"
                            >
                              <circle cx="12" cy="12" r="10" />
                              <line x1="4.93" y1="4.93" x2="19.07" y2="19.07" />
                            </svg>
                          </div>
                          <div>
                            <div
                              class="mono text-sm font-medium"
                              x-text="ban.address"
                            ></div>
                            <div
                              class="text-xs text-secondary"
                              x-text="ban.name || 'anyone' + (ban.reason ? ' — ' + ban.reason : '')"
                            ></div>
                          </div>
                        </div>
                        <span
                          class="badge"
                          :class="ban.duration === 0 ? 'badge-red' : 'badge-muted'"
                          x-text="ban.duration === 0 ? 'permanent' : formatDate(ban.expires)"
                        ></span>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
            </template>
          </div>

          <!-- ═══ LISTENING ═══ -->
          <div x-show="page === 'listening'">
            <div class="flex items-center justify-between mb-4">
              <h2 class="font-semibold text-base">Channel Listeners</h2>
              <span class="badge badge-muted" x-text="listening.length"></span>
            </div>
            <template x-if="listening.length === 0">
              <div class="empty-state">
                <svg
                  class="w-8 h-8"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                >
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <span class="text-sm">No active listeners</span>
              </div>
            </template>
            <template x-if="listening.length > 0">
              <div class="flex flex-col gap-2">
                <template x-for="item in listening" :key="item.user_session">
                  <div class="card">
                    <div class="card-body">
                      <div class="flex items-center gap-3">
                        <div
                          class="avatar"
                          :style="'background: ' + avatarColor(item.user_name)"
                          x-text="item.user_name.charAt(0).toUpperCase()"
                        ></div>
                        <div class="min-w-0">
                          <div
                            class="font-medium text-sm"
                            x-text="item.user_name"
                          ></div>
                          <div
                            class="text-xs text-secondary"
                            x-text="item.channels.map(c => c.name).join(', ')"
                          ></div>
                        </div>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </div>
      </main>

      <div class="toast-container">
        <template x-for="toast in toasts" :key="toast.id">
          <div
            class="toast"
            :class="toast.type"
            x-text="toast.message"
            x-transition
          ></div>
        </template>
      </div>
    </div>

    <script>
      function dashboard() {
        const colors = [
          "#6c8cff",
          "#34d399",
          "#f87171",
          "#fbbf24",
          "#a78bfa",
          "#22d3ee",
          "#fb7185",
          "#f59e0b",
        ];
        return {
          sidebarOpen: false,
          page: "overview",
          loading: true,
          users: [],
          channels: [],
          stats: { version: "", uptime: 0, max_users: 0 },
          serverName: "",
          logEntries: [],
          bans: [],
          listening: [],
          expandedUsers: [],
          openChannels: [],
          autoScroll: true,
          toasts: [],
          toastId: 0,
          statusClass: "",
          statusText: "connecting",

          get pageTitle() {
            const map = {
              overview: "Overview",
              channels: "Channels",
              users: "Users",
              activity: "Activity",
              bans: "Bans",
              listening: "Listeners",
            };
            return map[this.page] || "Dashboard";
          },

          get channelCount() {
            return this.channels.length;
          },

          get sortedBans() {
            return [...this.bans].sort((a, b) => {
              if (a.duration === 0) return 1;
              if (b.duration === 0) return -1;
              return a.expires - b.expires;
            });
          },

          get uptimeText() {
            return formatDuration(this.stats.uptime);
          },

          get activityData() {
            const days = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
            return days.map((d, i) => ({
              label: d,
              val: Math.max(
                1,
                this.users.length + Math.floor(Math.random() * 5),
              ),
              h: Math.min(95, 20 + Math.random() * 70),
            }));
          },

          // Build a flat list of channels with depth info for tree rendering
          get treeChannels() {
            if (!this.channels.length) return [];
            const chMap = {};
            this.channels.forEach((c) => {
              chMap[c.id] = { ...c, depth: 0, children: [] };
            });
            const roots = [];
            Object.values(chMap).forEach((c) => {
              if (c.parent === 0 || !chMap[c.parent]) {
                roots.push(c);
              } else {
                chMap[c.parent].children.push(c);
              }
            });
            const result = [];
            const walk = (ch, depth) => {
              ch.depth = depth;
              result.push(ch);
              ch.children.forEach((child) => walk(child, depth + 1));
            };
            roots.sort((a, b) => a.position - b.position);
            roots.forEach((r) => walk(r, 0));
            return result;
          },

          // Get users in a specific channel
          usersInChannel(channelId) {
            return this.users.filter((u) => u.channel_id === channelId);
          },

          // Compute channel users for each tree node
          get treeChannelNodes() {
            return this.treeChannels.map((node) => ({
              ch: node,
              depth: node.depth,
              hasChildren: node.children && node.children.length > 0,
              userCount: this.usersInChannel(node.id).length,
              channelUsers: this.usersInChannel(node.id),
            }));
          },

          init() {
            this.fetchAll();
            setInterval(() => this.fetchUsers(), 5000);
            setInterval(() => this.fetchChannels(), 5000);
            setInterval(() => this.fetchStats(), 30000);
            setInterval(() => this.fetchLog(), 5000);
            setInterval(() => {
              this.fetchBans();
              this.fetchListening();
            }, 15000);
          },

          async fetchAll() {
            await Promise.all([
              this.fetchUsers(),
              this.fetchChannels(),
              this.fetchStats(),
              this.fetchServerName(),
              this.fetchLog(),
              this.fetchBans(),
              this.fetchListening(),
            ]);
            this.loading = false;
          },

          async fetchUsers() {
            try {
              const r = await getJSON("/api/users");
              this.users = r || [];
              this.statusClass = "connected";
              this.statusText = "connected";
            } catch (e) {
              this.statusClass = "error";
              this.statusText = "disconnected";
            }
          },

          async fetchChannels() {
            try {
              this.channels = await getJSON("/api/channels");
            } catch (e) {}
          },

          async fetchStats() {
            try {
              const r = await getJSON("/api/stats");
              if (r) this.stats = r.stats || r;
            } catch (e) {}
          },

          async fetchServerName() {
            try {
              const r = await getJSON("/api/server-name");
              if (r) this.serverName = r.name;
            } catch (e) {}
          },

          async fetchLog() {
            try {
              const r = await getJSON("/api/log?first=0&last=200");
              if (r && r.entries) {
                const existing = new Set(
                  this.logEntries.map((l) => l.timestamp),
                );
                this.logEntries = [
                  ...this.logEntries,
                  ...r.entries.filter((e) => !existing.has(e.timestamp)),
                ].slice(-200);
                if (this.autoScroll && this.$refs.logBody)
                  this.$refs.logBody.scrollTop =
                    this.$refs.logBody.scrollHeight;
              }
            } catch (e) {}
          },

          async fetchBans() {
            try {
              const r = await getJSON("/api/bans");
              if (r) this.bans = r.bans || [];
            } catch (e) {}
          },

          async fetchListening() {
            try {
              const r = await getJSON("/api/listening");
              if (r) this.listening = r.listening || [];
            } catch (e) {}
          },

          channelName(id) {
            const ch = this.channels.find((c) => c.id === id);
            return ch ? ch.name : "Root";
          },

          avatarColor(name) {
            if (!name) return "var(--surface-3)";
            let h = 0;
            for (let i = 0; i < name.length; i++)
              h = name.charCodeAt(i) + ((h << 5) - h);
            return colors[Math.abs(h) % colors.length];
          },

          logLevel(text) {
            const t = text.toLowerCase();
            if (t.includes("connect") || t.includes("welcome"))
              return "success";
            if (t.includes("error") || t.includes("fail")) return "error";
            if (t.includes("ban") || t.includes("kick")) return "warn";
            return "info";
          },

          symToggle(arr, val) {
            const i = arr.indexOf(val);
            return i >= 0 ? arr.filter((v) => v !== val) : [...arr, val];
          },

          toast(message, type = "success") {
            const id = ++this.toastId;
            this.toasts.push({ id, message, type });
            setTimeout(() => {
              this.toasts = this.toasts.filter((t) => t.id !== id);
            }, 3000);
          },
        };
      }

      async function getJSON(url) {
        const r = await fetch(url);
        if (!r.ok) throw new Error(r.statusText);
        return r.json();
      }

      function formatDuration(secs) {
        if (!secs || secs < 60) return secs + "s";
        const m = Math.floor(secs / 60);
        if (m < 60) return m + "m";
        const h = Math.floor(m / 60);
        if (h < 24) return h + "h " + (m % 60) + "m";
        const d = Math.floor(h / 24);
        return d + "d " + (h % 24) + "h";
      }

      function formatTime(ts) {
        const d = new Date(ts * 1000);
        return d.toLocaleTimeString("en-US", { hour12: false });
      }

      function formatDate(ts) {
        if (!ts) return "--";
        const d = new Date(ts * 1000);
        return d.toLocaleDateString("en-US", {
          month: "short",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });
      }
    </script>
  </body>
</html>
